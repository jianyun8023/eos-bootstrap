---
- name: Read installed TLP version
  ansible.builtin.command:
    cmd: "tlp --version"
  register: power_tlp_version
  changed_when: false
  check_mode: false
  tags: [power]

- name: Assert TLP >= 1.9 for profile support
  ansible.builtin.assert:
    that:
      - (power_tlp_version.stdout | regex_search('\\d+\\.\\d+(\\.\\d+)?') | default('0.0', true)) is version('1.9', '>=')
    fail_msg: "TLP >= 1.9 is required for power profiles; found: {{ power_tlp_version.stdout }}"
  tags: [power]

- name: Deploy TLP drop-in config
  ansible.builtin.copy:
    src: tlp-eos.conf
    dest: /etc/tlp.d/00-eos.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply tlp
  tags: [power]

- name: Deploy eww power admin helper
  ansible.builtin.copy:
    src: eww-power-admin
    dest: /usr/local/sbin/eww-power-admin
    owner: root
    group: root
    mode: "0755"
  tags: [power]

- name: Sudoers drop for eww power admin
  ansible.builtin.copy:
    content: "{{ target_user }} ALL=(root) NOPASSWD: /usr/local/sbin/eww-power-admin\n"
    dest: /etc/sudoers.d/eww-power
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  tags: [power]

- name: Ensure logind drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [power]

- name: Deploy logind power key drop-in
  ansible.builtin.copy:
    src: logind-power-key.conf
    dest: /etc/systemd/logind.conf.d/20-power-key.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart logind
  tags: [power]

- name: Configure optional lid sensor debounce
  ansible.builtin.include_tasks:
    file: lid-watchdog.yml
    apply:
      tags: [power, lid-watchdog]
  when: power_lid_watchdog_enabled
  tags: [power, lid-watchdog]

- name: Deploy pre-sleep lock dispatcher
  ansible.builtin.copy:
    src: sleep-lock
    dest: /usr/local/sbin/eos-lock-before-sleep
    owner: root
    group: root
    mode: "0755"
  tags: [power, lock]

- name: Deploy pre-sleep lock unit
  ansible.builtin.template:
    src: lock-before-sleep.service.j2
    dest: /etc/systemd/system/eos-lock-before-sleep.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd for lid-watchdog
  tags: [power, lock]

- name: Require screen locking before sleep
  ansible.builtin.systemd_service:
    name: eos-lock-before-sleep.service
    enabled: true
    daemon_reload: true
  tags: [power, lock]
