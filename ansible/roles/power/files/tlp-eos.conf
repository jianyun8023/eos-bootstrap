# Managed by Ansible (eos-bootstrap, roles/power). Manual edits will be overwritten.
# Profile mapping for TLP_AUTO_SWITCH (smart mode): AC -> balanced, battery -> power-saver.
TLP_PROFILE_AC=BAL
TLP_PROFILE_BAT=SAV
# Keep the ASIX USB Ethernet adapter online. TLP actively sets denylisted
# devices to power/control=on instead of leaving the kernel's auto policy.
USB_AUTOSUSPEND=1
USB_DENYLIST="0b95:1790"
# Battery care: stop charging at 80% (ASUS honored values: 40/60/80).
STOP_CHARGE_THRESH_BAT0=80
