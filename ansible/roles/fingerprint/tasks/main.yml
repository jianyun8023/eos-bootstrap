---
- name: List attached USB devices for fingerprint detection
  ansible.builtin.shell: |
    set -o pipefail
    lsusb 2>/dev/null | awk '{ print tolower($6) }'
  register: fingerprint_usb_devices
  changed_when: false
  failed_when: fingerprint_usb_devices.rc != 0
  check_mode: false
  tags: [fingerprint]

- name: Record detected fingerprint hardware
  ansible.builtin.set_fact:
    fingerprint_native_detected: >-
      {{ (fingerprint_native_usb_ids | intersect(fingerprint_usb_devices.stdout_lines) | length) > 0 }}
    fingerprint_focaltech_detected: >-
      {{ fingerprint_focaltech_usb_id in fingerprint_usb_devices.stdout_lines }}
  tags: [fingerprint]

- name: Fingerprint sensor not detected - skipping setup
  ansible.builtin.debug:
    msg: "No configured fingerprint sensor found; skipping package and driver setup."
  when: not (fingerprint_native_detected or fingerprint_focaltech_detected)
  tags: [fingerprint]

- name: Install the distribution fingerprint stack
  community.general.pacman:
    name:
      - fprintd
      - libfprint
    state: present
  when: fingerprint_native_detected or fingerprint_focaltech_detected
  tags: [fingerprint]

- name: Check if driver stack is already deployed
  when: fingerprint_focaltech_detected
  ansible.builtin.shell: |
    set -o pipefail
    test -f '{{ fingerprint_driver_path }}' &&
    test -f '{{ fingerprint_shim_path }}' &&
    patchelf --print-needed '{{ fingerprint_driver_path }}' | grep -q 'focaltech-shim.so'
  register: fingerprint_installed_check
  changed_when: false
  failed_when: fingerprint_installed_check.rc not in [0, 1]
  check_mode: false
  tags: [fingerprint]

- name: Build and deploy FocalTech FT9366 driver stack
  when:
    - fingerprint_focaltech_detected
    - fingerprint_installed_check.rc != 0
  tags: [fingerprint]
  block:
    - name: Install FocalTech build dependencies
      community.general.pacman:
        name:
          - gcc
          - pkgconf
          - libgusb
          - patchelf
        state: present

    - name: Create build directory
      ansible.builtin.file:
        path: "{{ fingerprint_build_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Clone focaltech-ft9366-arch-shim repository
      ansible.builtin.git:
        repo: "{{ fingerprint_shim_repo }}"
        dest: "{{ fingerprint_build_dir }}/src"
        version: "{{ fingerprint_shim_repo_version }}"
        depth: 1

    - name: Compile compatibility shim
      ansible.builtin.shell: |
        set -o pipefail
        gcc -shared -fPIC \
          -Wl,--version-script=shim.map \
          -o focaltech-shim.so shim.c \
          $(pkg-config --cflags --libs glib-2.0) -ldl
      args:
        chdir: "{{ fingerprint_build_dir }}/src"
        creates: "{{ fingerprint_build_dir }}/src/focaltech-shim.so"

    - name: Deploy proprietary driver
      ansible.builtin.copy:
        src: "{{ fingerprint_build_dir }}/src/libfprint-2.so.2.0.0"
        dest: "{{ fingerprint_driver_path }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Restart fprintd

    - name: Deploy compatibility shim
      ansible.builtin.copy:
        src: "{{ fingerprint_build_dir }}/src/focaltech-shim.so"
        dest: "{{ fingerprint_shim_path }}"
        owner: root
        group: root
        mode: "0755"
        remote_src: true
      notify: Restart fprintd

    - name: Inject shim into proprietary driver via patchelf
      ansible.builtin.command:
        cmd: "patchelf --add-needed focaltech-shim.so {{ fingerprint_driver_path }}"
      changed_when: true
      notify: Restart fprintd

- name: Ensure FocalTech runtime configuration
  when: fingerprint_focaltech_detected
  tags: [fingerprint]
  block:
    - name: Deploy udev rules (device access)
      ansible.builtin.copy:
        src: "{{ fingerprint_build_dir }}/src/60-libfprint-2.rules"
        dest: /etc/udev/rules.d/60-libfprint-2.rules
        owner: root
        group: root
        mode: "0644"
        remote_src: true
      notify: Reload udev

    - name: Deploy udev rules (USB autosuspend fix)
      ansible.builtin.copy:
        src: 80-focaltech-autosuspend.rules
        dest: /etc/udev/rules.d/80-focaltech-autosuspend.rules
        owner: root
        group: root
        mode: "0644"
      notify: Reload udev

    - name: Deploy suspend/resume hook (restart fprintd after resume)
      ansible.builtin.copy:
        src: focaltech-fprint-resume
        dest: /usr/lib/systemd/system-sleep/focaltech-fprint-resume
        owner: root
        group: root
        mode: "0755"

- name: Flush driver handlers before probing fprintd
  ansible.builtin.meta: flush_handlers
  when: fingerprint_native_detected or fingerprint_focaltech_detected
  tags: [fingerprint]

- name: Verify that fprintd exposes the detected sensor
  ansible.builtin.command:
    cmd: "fprintd-list {{ target_user }}"
  register: fingerprint_fprintd_probe
  changed_when: false
  when: fingerprint_native_detected or fingerprint_focaltech_detected
  tags: [fingerprint]

- name: Validate requested PAM fingerprint services
  ansible.builtin.assert:
    that:
      - >-
        fingerprint_allow_high_risk_pam or
        (fingerprint_pam_services | intersect(fingerprint_high_risk_pam_services) | length == 0)
      - "'has no fingers enrolled' not in fingerprint_fprintd_probe.stdout"
    fail_msg: >-
      Refusing PAM fingerprint configuration: enroll and verify a finger first;
      sudo, polkit-1, and system-auth also require
      fingerprint_allow_high_risk_pam=true because of CVE-2024-37408.
  when:
    - fingerprint_native_detected or fingerprint_focaltech_detected
    - fingerprint_pam_services | length > 0
  tags: [fingerprint]

- name: Remove legacy PAM fingerprint rules unless explicitly enabled
  ansible.builtin.lineinfile:
    path: "/etc/pam.d/{{ item }}"
    regexp: "^auth\\s+.*pam_fprintd\\.so.*$"
    state: absent
  loop: "{{ fingerprint_legacy_pam_services }}"
  when:
    - fingerprint_native_detected or fingerprint_focaltech_detected
    - item not in fingerprint_pam_services
  tags: [fingerprint]

- name: Configure opt-in per-service PAM fingerprint authentication
  ansible.builtin.lineinfile:
    path: "/etc/pam.d/{{ item }}"
    regexp: "^auth\\s+.*pam_fprintd\\.so.*$"
    line: >-
      auth sufficient pam_fprintd.so timeout={{ fingerprint_pam_timeout }}
      max-tries={{ fingerprint_pam_max_tries }}
    insertbefore: "^auth"
    state: present
  loop: "{{ fingerprint_pam_services }}"
  when: fingerprint_native_detected or fingerprint_focaltech_detected
  tags: [fingerprint]
