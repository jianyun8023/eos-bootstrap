---
- name: Check for i3lock before installing betterlockscreen
  ansible.builtin.command:
    cmd: pacman -Qq
  register: packages_installed_before_betterlockscreen
  changed_when: false
  when: "'betterlockscreen' in aur_packages"

- name: Remove i3lock before installing betterlockscreen
  community.general.pacman:
    name: i3lock
    state: absent
  when:
    - >-
      'i3lock' in
      packages_installed_before_betterlockscreen.stdout_lines | default([])
    - "'betterlockscreen' in aur_packages"

- name: Check which AUR packages are already installed
  ansible.builtin.shell: |
    set -o pipefail
    pacman -Q {{ aur_packages | join(' ') }} >/dev/null 2>&1
  register: packages_aur_all_installed
  changed_when: false
  failed_when: false
  check_mode: false
  when: aur_packages | length > 0

- name: Install pending AUR packages
  when:
    - aur_packages | length > 0
    - packages_aur_all_installed.rc | default(1) != 0
  block:
    - name: Allow paru to invoke pacman without an interactive password
      ansible.builtin.copy:
        dest: /etc/sudoers.d/99-eos-bootstrap-paru
        content: >-
          {{ target_user }} ALL=(root) NOPASSWD: /usr/bin/pacman
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"

    - name: Install AUR packages via paru
      become: true
      become_user: "{{ target_user }}"
      environment:
        PARU: "1"
      ansible.builtin.command:
        cmd: "paru -S --needed --noconfirm {{ aur_packages | join(' ') }}"
      changed_when: false
      check_mode: false
      register: packages_aur_install
      failed_when: packages_aur_install.rc != 0
  always:
    - name: Remove temporary paru sudoers rule
      ansible.builtin.file:
        path: /etc/sudoers.d/99-eos-bootstrap-paru
        state: absent
