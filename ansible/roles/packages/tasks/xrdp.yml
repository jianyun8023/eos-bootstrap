---
- name: Deploy xrdp.ini with VNC backend
  become: true
  ansible.builtin.template:
    src: xrdp.ini.j2
    dest: /etc/xrdp/xrdp.ini
    owner: root
    group: root
    mode: "0644"
  notify: Restart xrdp
  tags: [xrdp]

- name: Create xrdp.service systemd override directory
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/xrdp.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags: [xrdp]

- name: Deploy xrdp restart-on-failure override
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/xrdp.service.d/restart.conf
    content: |
      [Service]
      Restart=on-failure
      RestartSec=5
    owner: root
    group: root
    mode: "0644"
  notify: Restart xrdp
  tags: [xrdp]

- name: Deploy xrdp unbind-sesman override
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/xrdp.service.d/unbind-sesman.conf
    content: |
      [Unit]
      Requires=
      BindsTo=
    owner: root
    group: root
    mode: "0644"
  notify: Restart xrdp
  tags: [xrdp]

# daemon-reload must happen before any xrdp/sesman service operations so
# the unbind-sesman override (Requires=) is picked up.  The handler alone
# is not enough: on steady-state runs the override file is unchanged (ok),
# the handler is never notified, and systemd still sees the stock
# Requires=xrdp-sesman.service — starting xrdp would pull sesman back in.
- name: Reload systemd to pick up xrdp overrides
  become: true
  ansible.builtin.systemd:
    daemon_reload: true
  changed_when: false
  tags: [xrdp]

# xrdp.service has Requires=xrdp-sesman.service.  On systemd 261 the
# drop-in "Requires=" empty-assignment does NOT clear the dependency
# (verified: the unit still pulls sesman in).  Stopping sesman therefore
# also stops xrdp, making a disable-and-stop task inherently
# non-idempotent.  We only disable sesman (prevent boot autostart) and
# let xrdp manage its lifecycle at runtime.
- name: Disable xrdp-sesman.service (boot autostart)
  become: true
  ansible.builtin.systemd:
    name: xrdp-sesman.service
    enabled: false
  tags: [xrdp]

- name: Enable and start xrdp.service
  become: true
  ansible.builtin.systemd:
    name: xrdp.service
    enabled: true
    state: started
  tags: [xrdp]

- name: Check whether firewalld is active
  become: true
  ansible.builtin.command:
    cmd: systemctl is-active firewalld.service
  register: packages_xrdp_firewalld_active
  changed_when: false
  failed_when: packages_xrdp_firewalld_active.rc not in [0, 3, 4]
  check_mode: false
  tags: [xrdp]

- name: Check runtime firewalld RDP service
  become: true
  ansible.builtin.command:
    cmd: >-
      firewall-cmd --zone={{ xrdp_firewalld_zone }} --query-service=rdp
  register: packages_xrdp_firewalld_runtime
  changed_when: false
  failed_when: packages_xrdp_firewalld_runtime.rc not in [0, 1]
  when: packages_xrdp_firewalld_active.rc == 0
  check_mode: false
  tags: [xrdp]

- name: Check permanent firewalld RDP service
  become: true
  ansible.builtin.command:
    cmd: >-
      firewall-cmd --permanent --zone={{ xrdp_firewalld_zone }}
      --query-service=rdp
  register: packages_xrdp_firewalld_permanent
  changed_when: false
  failed_when: packages_xrdp_firewalld_permanent.rc not in [0, 1]
  when: packages_xrdp_firewalld_active.rc == 0
  check_mode: false
  tags: [xrdp]

- name: Allow RDP permanently when firewalld is active
  become: true
  ansible.builtin.command:
    cmd: >-
      firewall-cmd --permanent --zone={{ xrdp_firewalld_zone }}
      --add-service=rdp
  when:
    - not ansible_check_mode
    - packages_xrdp_firewalld_active.rc == 0
    - packages_xrdp_firewalld_permanent.rc == 1
  changed_when: true
  tags: [xrdp]

- name: Allow RDP in the runtime firewalld zone
  become: true
  ansible.builtin.command:
    cmd: >-
      firewall-cmd --zone={{ xrdp_firewalld_zone }} --add-service=rdp
  when:
    - not ansible_check_mode
    - packages_xrdp_firewalld_active.rc == 0
    - packages_xrdp_firewalld_runtime.rc == 1
  changed_when: true
  tags: [xrdp]

- name: Check for legacy x0vncserver user service
  ansible.builtin.stat:
    path: "/home/{{ target_user }}/.config/systemd/user/x0vncserver.service"
  register: packages_legacy_vnc_unit
  tags: [xrdp]

- name: Stop and disable legacy x0vncserver user service
  become: true
  become_user: "{{ target_user }}"
  vars:
    _uid: "{{ lookup('pipe', 'id -u ' + target_user) | trim | int }}"
  ansible.builtin.systemd:
    name: x0vncserver.service
    enabled: false
    state: stopped
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ _uid }}"
  when: packages_legacy_vnc_unit.stat.exists
  tags: [xrdp]

- name: Remove legacy x0vncserver user unit and links
  ansible.builtin.file:
    path: "/home/{{ target_user }}/.config/systemd/user/{{ item }}"
    state: absent
  loop:
    - default.target.wants/x0vncserver.service
    - graphical-session.target.wants/x0vncserver.service
    - x0vncserver.service
  notify: Reload user systemd
  tags: [xrdp]

- name: Deploy x0vncserver system service for LightDM
  ansible.builtin.template:
    src: x0vncserver.service.j2
    dest: /etc/systemd/system/x0vncserver.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart x0vncserver
  tags: [xrdp]

- name: Enable and start x0vncserver system service
  ansible.builtin.systemd:
    name: x0vncserver.service
    enabled: true
    state: started
    daemon_reload: true
  tags: [xrdp]
